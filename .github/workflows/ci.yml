name: Plugin source validation

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Validate the Desktop plugin and marketplace manifests
        run: npm run validate

  source-preflight:
    needs: manifest
    uses: xsec-labs/xsec-plugins/.github/workflows/first-party-source-preflight.yml@main
    with:
      plugin_id: com.xsec.workspace.approvals

  frontend:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify generated frontend and notices
        run: git diff --exit-code -- com.xsec.desktop/frontend/index.js com.xsec.desktop/THIRD_PARTY_NOTICES.txt
